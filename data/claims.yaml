# Structured copy of the tables in README.md.
# One entry per claim. `label` follows docs/evidence-rules.md.
# Keep `hardware` honest: write "not pinned" when the source does not say.

schema: 1
updated: 2026-11-22

claims:
  - id: isaacgym-anymal-minutes
    engine: Isaac Gym
    task: ANYmal locomotion (PPO)
    claim: flat terrain trained in under 4 minutes; uneven terrain in about 20 minutes
    hardware: single workstation GPU (model not pinned in the paper)
    source:
      type: paper
      title: Learning to Walk in Minutes Using Massively Parallel Deep Reinforcement Learning
      venue: CoRL 2021
      url: https://arxiv.org/abs/2109.11978
    code: https://github.com/leggedrobotics/legged_gym
    label: UPSTREAM

  - id: isaacgym-speedup
    engine: Isaac Gym
    task: general RL training, physics and network on one GPU
    claim: 2-3 orders of magnitude faster than CPU simulator plus GPU network training
    hardware: single GPU (model not pinned in the paper)
    source:
      type: paper
      title: Isaac Gym - High Performance GPU-Based Physics Simulation For Robot Learning
      url: https://arxiv.org/abs/2108.10470
    label: UPSTREAM

  - id: playground-minutes
    engine: MuJoCo Playground (MJX)
    task: quadrupeds, humanoids, dexterous hands, arms; state and pixel inputs
    claim: train policies in minutes on a single GPU; zero-shot sim-to-real
    hardware: single GPU (model not pinned in the abstract)
    source:
      type: paper
      title: MuJoCo Playground
      url: https://arxiv.org/abs/2502.08844
    code: https://github.com/google-deepmind/mujoco_playground
    label: UPSTREAM

  - id: cartpole-cpu-vs-mjx
    engine: MuJoCo 4.0.1 vs MJX on CPU
    task: cart-pole, dt=0.002, 200 steps per run, 8/32/64 environments
    claim: MuJoCo python loop flat at about 212k env-steps/s; MJX 317k / 450k / 522k at 8 / 32 / 64 envs
    hardware: RTX 5070 Ti Laptop 12 GB, WSL2 Ubuntu 24.04, 24 cores (CPU-only run; no CUDA jaxlib)
    source:
      type: repo
      title: sim-throughput-benchmark
      url: https://github.com/cccjj55/sim-throughput-benchmark
    artifact: results/latest.md, results/accuracy.md
    label: MEASURED
    note: >
      Shows the Python loop, not the integrator, was the limit at these sizes. Does not say anything
      about GPU throughput, which is the row this repo is still missing.

  - id: envpool-mujoco-ant
    engine: EnvPool (C++ threadpool)
    task: MuJoCo Ant-v3 simulation throughput
    claim: "~3M raw simulation steps/sec on MuJoCo Ant-v3 (~20x over Python subprocess baseline)"
    hardware: NVIDIA DGX-A100 (256 CPU cores)
    source:
      type: repo
      title: "EnvPool: A Highly Parallelized Reinforcement Learning Environment Execution Engine"
      venue: NeurIPS 2022
      url: https://github.com/sail-sg/envpool#readme
    code: https://github.com/sail-sg/envpool
    label: UPSTREAM

  - id: parallel-envs-cpu-openmp
    engine: MuJoCo 4.0.1 (Python vs multiprocessing vs mujoco.rollout vs C++17 OpenMP)
    task: 1-body & 12-body chains, 48 tasks x 4,000 steps/task
    claim: "1body: py serial 968k/s, threads w=12 51k/s (0.05x), proc_reuse w=12 5.43M/s, mj_rollout 6.44M/s, cpp_openmp w=12 10.75M/s (11.11x); 12body: 104k/s -> 566k/s (5.45x)"
    hardware: Intel i7-14650HX (WSL2 Ubuntu 24.04, 6 physical cores / 12 threads), gcc 16.2.0
    source:
      type: repo
      title: parallel-envs v0.2.0
      url: https://github.com/cccjj55/parallel-envs
    artifact: docs/parallel_scaling.svg
    label: MEASURED
    note: >
      Moving only the stepping loop to C++ (1 thread) already gives 2.60x on 1body (62% was Python FFI
      overhead) and 1.10x on 12body. On 12body, 6 physical cores saturate around ~5.5x-5.7x.

  - id: gpu-kernels-softmax-rewrite
    engine: CUDA 13.5 on RTX 5070 Ti Laptop (sm_120) vs 12-thread CPU
    task: axpy (16.7M doubles), softmax (4.2M doubles), tiled matmul (n=512, fp32/fp64)
    claim: >
      axpy 402.8 GB/s (6.9x CPU 58.4); matmul fp64 445.6 GFLOP/s (6.3x CPU 70.6);
      softmax one-block 0.26 Gelem/s (0.22x CPU) -> grid-stride 5.90 Gelem/s (4.9x CPU, 22.9x over the block version)
    hardware: RTX 5070 Ti Laptop 12 GB (sm_120), i7-14650HX 12 threads, gcc 16.2.0, nvcc 13.5
    source:
      type: repo
      title: hpc-kernels v1.1.0
      url: https://github.com/cccjj55/hpc-kernels
    artifact: docs/kernels_gpu.svg
    label: MEASURED
    note: >
      The naive port being 4.5x slower than the CPU is the useful row, not the 6-7x ones: launch geometry
      decided it, and the rewrite changed only geometry and reduction structure.

  - id: gpu-cg-crossover
    engine: GPU CG vs 12-thread CPU CG on one FEM matrix
    task: 2D P1 Poisson, 159k and 638k DOF, tol 1e-10
    claim: >
      GPU end-to-end CG 2.07x at 638k DOF (465 vs 962 ms) but 0.44x at 159k DOF (147 vs 65 ms);
      SpMV alone 392.9 GB/s equals the measured device copy bandwidth 392.3 GB/s
    hardware: RTX 5070 Ti Laptop 12 GB, i7-14650HX 12 threads, nvcc 13.5
    source:
      type: repo
      title: cae-parallel-solver v1.0.0
      url: https://github.com/cccjj55/cae-parallel-solver
    artifact: docs/gpu_cg.svg
    label: MEASURED
    note: >
      Three dot products per iteration dominate when SpMV is only 19 us; sustained SpMV drops from
      392.9 to 192.8 GB/s after 3,000 repetitions, so burst numbers are optimistic.
